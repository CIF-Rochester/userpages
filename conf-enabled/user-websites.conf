AliasMatch ^/users/?$ /web/users/index.html

AliasMatch ^/users/([A-Za-z0-9._-]+)/?$ /home/$1/www/
AliasMatch ^/users/([A-Za-z0-9._-]+)(/.*)$ /home/$1/www$2

<Directory "/web/users">
    Require all granted
</Directory>

<DirectoryMatch "^/home/[^/]+/www">
    Options +Indexes
    AllowOverride None
    Require all granted
</DirectoryMatch>
